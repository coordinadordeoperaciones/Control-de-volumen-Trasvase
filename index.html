<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sistema de Control de Varillaje – Despacho / Trasteo | TECKNOLOGISTIC</title>
<style>
/* ===== Identidad corporativa (tomada del HTML de referencia): guinda + gris carbón ===== */
:root{--g:#A93B3C;--gd:#7E2B2C;--ink:#1B1F27;--grey:#595959;--bg:#F4F5F7;--line:#DDDAD2;--ok:#1E7B4D;--err:#B3261E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 'Segoe UI',Helvetica,Arial,sans-serif}
header{background:#fff;border-bottom:2px solid var(--g);padding:10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 4px #0001}
header img{height:34px}header div{flex:1;line-height:1.2}header b{font-size:15px}header small{display:block;color:var(--grey);font-size:11px}
#badge{font-size:12px;font-weight:600;padding:5px 11px;border-radius:20px;background:#EDEDEC;white-space:nowrap}#badge.d{background:#FFF3D6;color:#7a5200}#badge.s{background:#E5F4EC;color:var(--ok)}
main{max-width:980px;margin:0 auto;padding:14px 14px 96px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--gd);border-bottom:1px solid var(--line);padding-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
label{font-size:12px;font-weight:600;color:var(--grey);display:block;margin-bottom:3px}
input,textarea{width:100%;padding:9px 10px;border:1px solid #C9C6BD;border-radius:6px;font:inherit;background:#fff}
input:focus,textarea:focus{outline:2px solid #A93B3C55;border-color:var(--g)}.err{border-color:var(--err)!important;background:#FBE9E7}
.sig{border:1px solid var(--line);border-radius:8px;padding:10px;background:#FAFAF8}
.sig canvas{width:100%;aspect-ratio:3/1;background:#fff;border:1px dashed #999;border-radius:6px;touch-action:none;cursor:crosshair;display:block}
.sig .r{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;font-size:12px;font-weight:700}
.btn{border:0;border-radius:7px;padding:10px 16px;font:600 14px inherit;font-family:inherit;cursor:pointer;background:var(--g);color:#fff}
.btn:hover{background:var(--gd)}.btn.s{background:#EDEDEC;color:var(--ink)}.btn.s:hover{background:#E0E0DE}.btn.sm{padding:6px 10px;font-size:12px}.btn.x{background:#FBE9E7;color:var(--err)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:20;box-shadow:0 -2px 10px #0001}
nav button{flex:1;border:0;background:0;padding:10px 4px;min-height:58px;font:600 12px inherit;font-family:inherit;color:var(--grey);cursor:pointer}
nav button.on{color:var(--g);box-shadow:inset 0 3px 0 var(--g)}nav button i{display:block;font-style:normal;font-size:20px}
#pv{width:100%;max-width:794px;display:block;margin:0 auto 12px;background:#fff;border:1px solid #bbb;box-shadow:0 2px 10px #0002}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-left:4px solid var(--g);border-radius:8px;padding:10px}.kpi b{font-size:24px;display:block}.kpi span{font-size:12px;color:var(--grey)}
.it{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}.it .n{font-weight:700;color:var(--gd)}.it p{margin:2px 0;font-size:13px;color:#333}
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:40;max-width:92%;display:none;text-align:center}
[hidden]{display:none!important}

header{flex-wrap:wrap}.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.rd{display:inline-flex;align-items:center;gap:6px;margin:4px 14px 4px 0;font-size:14px;font-weight:600;color:var(--ink)}
input[type=radio],input[type=checkbox]{width:auto}.sub{font-weight:700;color:var(--gd);font-size:13px;margin:10px 0 6px}.sig .sub{margin-top:0}.sig input{margin-bottom:8px}
.hint{font-size:12px;color:var(--grey);margin:0 0 8px}textarea{resize:vertical}
.pvc{width:100%;max-width:1123px;display:block;margin:0 auto 14px;background:#fff;border:1px solid #bbb;box-shadow:0 2px 10px #0002}
nav button{font-size:11px;padding:8px 2px}nav button i{font-size:18px}main{max-width:1100px}
.sig canvas{aspect-ratio:3/1}
</style></head><body>

<script>
"use strict";
/* ================= UTILIDADES ================= */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const MES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const p2=n=>String(n).padStart(2,'0'),hoy=()=>{const d=new Date();return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`};
const fd=s=>{if(!s)return '';const[y,m,d]=s.split('-');return `${d} – ${MES[m-1]} – ${y}`};          // 22 – Noviembre – 2026
const h12=t=>{if(!t)return '';const[h,m]=t.split(':');return `${p2(h%12||12)}:${m} ${h<12?'am':'pm'}`};
const toast=(m,ms=3200)=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',ms)};
const IC={},img=s=>IC[s]||(IC[s]=new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=s}));


const mc=document.createElement('canvas').getContext('2d');
const W=(s,z,b,i)=>{mc.font=`${i?'italic ':''}${b?'bold ':''}100px Helvetica,Arial,sans-serif`;return mc.measureText(s).width/100*z*25.4/72};
function wrap(s,w1,w2,z,b,i){const o=[];let c='',w=w1;for(const par of String(s).split('\n')){for(const wd of par.split(/\s+/).filter(Boolean)){const t=c?c+' '+wd:wd;if(!c||W(t,z,b,i)<=w)c=t;else{o.push(c);c=wd;w=w2}}o.push(c);c='';w=w2}return o}

const WA={'–':150,'—':151,'“':147,'”':148,'‘':145,'’':146,'…':133,'•':149};
const lat=s=>Uint8Array.from(s,c=>c.charCodeAt(0)&255);
async function jpg(src){const i=await img(src),c=document.createElement('canvas');c.width=i.naturalWidth;c.height=i.naturalHeight;const x=c.getContext('2d');
 x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0);return{w:c.width,h:c.height,u:lat(atob(c.toDataURL('image/jpeg',1).split(',')[1]))}}

/* ================= CONSTANTES ================= */
/* Supervisoras / ayudantes de Tecknologistic (catastro del HTML anterior): [cédula, nombre, cargo] */
const SUPS=[['2200535694','DELGADO PANEZO DIXON ALEXIS','Ayudante'],['0402093306','SUAREZ BURGOS JEIMY AVIGAIL','Supervisora'],
 ['1724018484','CALVACHE CAICEDO VERONICA PAULETTE','Supervisora'],['0503608200','MOLINA AYALA NELSON SANTIAGO','Ayudante']];
/* Texto de la declaración (editable). Marcadores: {RECIBE} {ENTREGA} {CANTIDAD} {GUIA} */
const DECL_TXT='Yo, {RECIBE} en mi calidad de responsable de la recepción del producto, declaro que he recibido de {ENTREGA} el producto o servicio descrito anteriormente en las condiciones convenidas. Declaro que tras la revisión y aceptación del producto/servicio no tengo reclamaciones respecto a su entrega, declaro que se ha recibido la cantidad de {CANTIDAD} según guía de entrega {GUIA} a mi entera satisfacción. Así mismo, libero de toda responsabilidad a TECKNOLOGISTIC S.A, sus empleados, representantes y afiliados de cualquier responsabilidad futura relacionada con pérdidas que pueda surgir en relación con el producto, una vez firmado este documento de conformidad. Entiendo y acepto que cualquier reclamación posterior a la firma de este documento queda sin efecto y no será motivo de responsabilidad para TECKNOLOGISTIC S.A.';
const REM_TXT='El remanente de las mangueras es colocado en un recipiente seguro, para ser trasladado y depositado al área de desechos de lubricantes por parte del señor mecánico del segmento antes en mención. Si no hay remanente de combustible su respuesta será negativa.';
const fl=s=>{if(!s)return '';const[y,m,d]=s.split('-');return `${d}/${m}/${y}`},fs=s=>{if(!s)return '';const[y,m,d]=s.split('-');return `${d}/${m}/${y.slice(2)}`};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ================= ESTADO DEL DOCUMENTO (D) ================= */
const newRow=(p={})=>({fecha:hoy(),hora:'',cm:'',galA:'',agua:'',diesel:'',cant:'',sello:'N/A',loc:p.loc||'',guia:'N/A',perm:p.perm||'',rp:'',rci:'',rf:null,mh:'',cp:'',cci:'',cf:null});
const newDoc=()=>({h:{fecha:hoy(),tanquero:'',placa:'',conductor:'',guiaP:'N/A'},rows:[newRow()],
 d:{loc:'',taladro:'',recibe:'',entrega:'',cant:'',guia:'N/A',nSup:'',texto:DECL_TXT,fSup:null,fEnt:null},
 i:{inspector:'',segmento:'',manholes:'',confirma:false,tipo:'',cant:'',cap:'',placa:'',rem:'',fSup:null,fRec:null}});
let D=newDoc(),cur={id:null,nro:null,creado:null},dirty=false,LOGO,LAR=3;
const get=p=>p.split('.').reduce((o,k)=>o==null?o:o[k],D),set=(p,v)=>{const a=p.split('.'),l=a.pop();a.reduce((o,k)=>o[k],D)[l]=v};
const autoD=r=>r.galA!==''&&!isNaN(r.galA)?String(+r.galA-(+r.agua||0)):'';              // Diesel (A-B)
const total=doc=>doc.rows.reduce((a,r)=>a+(parseFloat(r.cant)||0),0);
const fmtN=n=>Number.isInteger(n)?String(n):n.toFixed(1);
/* Valores efectivos: lo escrito por el usuario o, si está vacío, el dato deducido de los despachos */
function eff(doc){const f=doc.rows[0]||{},t=total(doc),d={...doc.d},i={...doc.i};
 d.loc=d.loc||f.loc;d.recibe=d.recibe||f.cp;d.entrega=d.entrega||f.rp;d.cant=d.cant||(t?fmtN(t):'');
 i.inspector=i.inspector||f.rp;i.segmento=i.segmento||d.taladro;i.cant=i.cant||d.cant;i.placa=i.placa||doc.h.placa;
 i.manholes=i.manholes||doc.rows.map(r=>r.mh).filter(Boolean).join(', ');return{d,i}}

/* ================= FORMULARIOS (se generan desde el estado) ================= */
const fld=(p,l,t='text',a='',ph='')=>`<div><label>${l}</label><input data-p="${p}" data-ph="${ph}" placeholder="${ph}" type="${t}" value="${esc(get(p))}" ${t=='number'?'step="any" min="0" inputmode="decimal"':''} ${a}></div>`;
const rad=(p,l,v)=>`<label class="rd"><input type="radio" name="${p}" data-p="${p}" value="${v}" ${get(p)==v?'checked':''}> ${l}</label>`;
const sig=(p,l)=>`<div class="r"><span>${l}</span><button type="button" class="btn s sm" data-clr="${p}">Borrar / volver a firmar</button></div><canvas data-sig="${p}" width="600" height="200"></canvas>`;
const RF=[['fecha','Fecha','date'],['hora','Hora','time'],['cm','Varillaje cm','number'],['galA','Varillaje gal (A)','number'],['agua','Agua gal (B)','number'],['diesel','Diesel gal (A-B)','number'],
 ['cant','Cantidad despachada (gal)','number'],['sello','Sello de seguridad'],['loc','Local / Pozo'],['guia','Guía Shaya'],['perm','Permiso de trabajo'],['mh','N.º de manhole']];
const rowCard=(r,i)=>`<div class="card"><h2>Despacho N.º ${i+1}<button class="btn x sm" style="float:right" data-do="del" data-i="${i}">Eliminar fila</button></h2>
 <div class="grid g4">${RF.map(([k,l,t])=>fld(`rows.${i}.${k}`,l,t)).join('')}</div>
 <div class="grid" style="margin-top:12px">
 <div class="sig"><div class="sub">Realizado por (entrega)</div>${fld(`rows.${i}.rp`,'Nombre')}${fld(`rows.${i}.rci`,'CI','text','inputmode="numeric"')}${sig(`rows.${i}.rf`,'Firma de quien entrega')}</div>
 <div class="sig"><div class="sub">Recibido por</div>${fld(`rows.${i}.cp`,'Nombre','text','list="dlS"')}${fld(`rows.${i}.cci`,'CI','text','inputmode="numeric"')}${sig(`rows.${i}.cf`,'Firma de quien recibe')}</div></div></div>`;
function renderAll(){
 $('#v-datos').innerHTML=`<div class="card"><h2>Documento</h2><div class="grid"><div><label>N.º de registro</label><input value="${esc(cur.nro||'Se asigna al guardar')}" readonly></div>${fld('h.fecha','Fecha del documento','date')}</div></div>
 <div class="card"><h2>Datos del tanquero</h2><div class="grid">${fld('h.tanquero','N.º / identificación del tanquero')}${fld('h.placa','Placa','text','style="text-transform:uppercase"')}</div></div>
 <div class="card"><h2>Datos del conductor</h2><div class="grid">${fld('h.conductor','Nombre completo del conductor')}${fld('h.guiaP','Guía Petrocomercial')}</div></div>
 <div class="card acts"><button class="btn" data-do="save">💾 Guardar registro</button><button class="btn" data-do="pdf">⬇ Generar PDF</button><button class="btn s" data-do="prev">👁 Vista previa</button><button class="btn s" data-do="dup">⧉ Duplicar registro</button><button class="btn x" data-do="clear">Limpiar / nuevo</button></div>`;
 $('#v-desp').innerHTML=`${D.rows.map(rowCard).join('')}<div class="card acts"><button class="btn" data-do="add">+ Agregar despacho</button><button class="btn s" data-do="save">💾 Guardar registro</button></div>`;
 $('#v-decl').innerHTML=`<div class="card"><h2>Declaración de exención de responsabilidad</h2><p class="hint">Los campos vacíos se completan solos con los datos de los despachos (se muestran en gris).</p>
  <div class="grid">${fld('d.loc','Locación','text','','')}${fld('d.taladro','Taladro / Servicio')}${fld('d.recibe','Nombre de quien recibe')}${fld('d.entrega','Nombre de quien entrega')}${fld('d.cant','Cantidad de combustible entregado (gal)')}${fld('d.guia','Guía (si corresponde)')}</div>
  <label style="margin-top:10px">Texto de la declaración (editable) — marcadores: {RECIBE} {ENTREGA} {CANTIDAD} {GUIA}</label><textarea data-p="d.texto" rows="7">${esc(D.d.texto)}</textarea>
  <button class="btn s sm" style="margin-top:6px" data-do="rtxt">Restaurar texto original</button></div>
  <div class="card"><h2>Firmas de la declaración</h2><div class="grid">
  <div class="sig"><div class="sub">Supervisor / Ayudante – Tecknologistic</div>${fld('d.nSup','Nombre','text','list="dlS"')}${sig('d.fSup','Firma Supervisor/Ayudante')}</div>
  <div class="sig"><div class="sub">Persona que entrega</div><p class="hint">El nombre sale del campo «Nombre de quien entrega».</p>${sig('d.fEnt','Firma y nombre (persona que entrega)')}</div></div></div>`;
 $('#v-insp').innerHTML=`<div class="card"><h2>Inspección visual de compartimentos</h2><div class="grid">${fld('i.inspector','Nombre del inspector')}${fld('i.segmento','Segmento / compañía / Taladro-servicio')}${fld('i.manholes','N.º de manholes inspeccionados')}${fld('i.cant','Cantidad de combustible (gal)')}${fld('i.placa','Placa del tanquero','text','style="text-transform:uppercase"')}</div>
  <div class="sub">Tipo de operación</div>${rad('i.tipo','RIG W.O. (Workover)','wo')}${rad('i.tipo','RIG Perforación','rig')}
  <div class="sub">Capacidad del tanquero</div>${rad('i.cap','6.000 galones','6000')}${rad('i.cap','10.000 galones','10000')}
  <div class="sub">Confirmación</div><label class="rd"><input type="checkbox" data-p="i.confirma" ${D.i.confirma?'checked':''}> Confirmo que se inspeccionaron visualmente los manholes</label></div>
  <div class="card"><h2>Control de remanente de mangueras</h2><p class="hint" style="font-size:13px">${REM_TXT}</p>${rad('i.rem','SÍ','si')}${rad('i.rem','NO','no')}</div>
  <div class="card"><h2>Firmas de la inspección</h2><div class="grid"><div class="sig">${sig('i.fSup','Firma Supervisor/Ayudante')}</div><div class="sig">${sig('i.fRec','Firma quien recibe')}</div></div></div>`;
 padInit();refreshPH();
}
/* Placeholders con los valores automáticos */
function refreshPH(){const E=eff(D);
 [['d.loc',E.d.loc],['d.recibe',E.d.recibe],['d.entrega',E.d.entrega],['d.cant',E.d.cant],['i.inspector',E.i.inspector],['i.segmento',E.i.segmento],['i.manholes',E.i.manholes],['i.cant',E.i.cant],['i.placa',E.i.placa]]
  .forEach(([p,v])=>{const e=$(`[data-p="${p}"]`);if(e&&!e.value)e.placeholder=v?'Auto: '+v:''});
 D.rows.forEach((r,i)=>{const e=$(`[data-p="rows.${i}.diesel"]`);if(e&&!e.value)e.placeholder=autoD(r)?'Auto: '+autoD(r):''})}

/* ================= FIRMAS (canvas independientes) ================= */
function padInit(){$$('canvas[data-sig]').forEach(c=>{const p=c.dataset.sig,x=c.getContext('2d');let dr=false,lx,ly;
 x.lineWidth=2.4;x.lineCap=x.lineJoin='round';x.strokeStyle=x.fillStyle='#10204a';
 const v=get(p);if(v)img(v).then(i=>x.drawImage(i,0,0));
 const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
 c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);dr=true;[lx,ly]=pt(e);x.beginPath();x.arc(lx,ly,1.2,0,7);x.fill();e.preventDefault()};
 c.onpointermove=e=>{if(!dr)return;const[a,b]=pt(e);x.beginPath();x.moveTo(lx,ly);x.lineTo(a,b);x.stroke();[lx,ly]=[a,b]};
 c.onpointerup=c.onpointercancel=()=>{if(dr){dr=false;set(p,c.toDataURL('image/png'));touch()}}})}
const sinFirmas=()=>{const f=[];D.rows.forEach((r,i)=>{if(!r.rf)f.push(`fila ${i+1} (entrega)`);if(!r.cf)f.push(`fila ${i+1} (recibe)`)});
 [['d.fSup','declaración: supervisor/ayudante'],['d.fEnt','declaración: quien entrega'],['i.fSup','inspección: supervisor/ayudante'],['i.fRec','inspección: quien recibe']].forEach(([p,l])=>{if(!get(p))f.push(l)});return f};

/* ================= EVENTOS Y AUTOGUARDADO ================= */
function badge(){const b=$('#badge');b.className=dirty||!cur.nro?'d':'s';b.textContent=(cur.nro||'Borrador')+(dirty?' · sin guardar':cur.nro?' · guardado':'')}
function touch(){dirty=true;badge();refreshPH();try{localStorage.setItem('var_draft',JSON.stringify({cur,D}))}catch{}}   // respaldo anti-pérdida
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
document.addEventListener('input',e=>{const t=e.target,p=t.dataset&&t.dataset.p;if(!p)return;
 if(/placa$/.test(p)){t.value=t.value.toUpperCase()}
 set(p,t.type=='checkbox'?t.checked:t.value);
 if(/\.cp$/.test(p)){const s=SUPS.find(x=>x[1]==t.value.trim().toUpperCase()),ci=$(`[data-p="${p.replace(/cp$/,'cci')}"]`);if(s&&ci&&!ci.value){ci.value=s[0];set(p.replace(/cp$/,'cci'),s[0])}}
 touch()});
document.addEventListener('click',async e=>{
 const c=e.target.dataset.clr;if(c){set(c,null);const cv=$(`canvas[data-sig="${c}"]`);cv.getContext('2d').clearRect(0,0,cv.width,cv.height);touch();return}
 const a=e.target.closest('[data-do]');if(!a)return;const x=a.dataset.do;
 if(x=='save')await guardar();else if(x=='pdf')await pdfActual();else if(x=='prev')go('prev');else if(x=='dup')duplicar(D);else if(x=='clear')nuevo();
 else if(x=='rtxt'){D.d.texto=DECL_TXT;$('[data-p="d.texto"]').value=DECL_TXT;touch()}
 else if(x=='add'){const l=D.rows[D.rows.length-1]||{};D.rows.push(newRow(l));renderAll();touch();scrollTo(0,document.body.scrollHeight)}
 else if(x=='del'){const i=+a.dataset.i;if(D.rows.length<2)return toast('Debe existir al menos un despacho');if(confirm(`¿Eliminar el despacho N.º ${i+1}?`)){D.rows.splice(i,1);renderAll();touch()}}});

/* ================= VALIDACIÓN ================= */
function validar(){const er=[],E=eff(D),m=p=>{const e=$(`[data-p="${p}"]`);e&&e.classList.add('err')};$$('.err').forEach(e=>e.classList.remove('err'));
 [['h.tanquero','Tanquero'],['h.placa','Placa'],['h.conductor','Conductor']].forEach(([p,l])=>{if(!get(p)){er.push(l);m(p)}});
 D.rows.forEach((r,i)=>{['fecha','hora','cant'].forEach(f=>{if(!r[f]){er.push(`Despacho ${i+1}: ${f=='cant'?'cantidad':f}`);m(`rows.${i}.${f}`)}});
  ['rci','cci'].forEach(f=>{if(r[f]&&!/^\d{6,13}$/.test(r[f])){er.push(`Despacho ${i+1}: CI solo números`);m(`rows.${i}.${f}`)}})});
 if(!E.d.loc)er.push('Locación (declaración)');if(!E.d.recibe)er.push('Quien recibe (declaración)');if(!E.d.entrega)er.push('Quien entrega (declaración)');
 if(er.length)toast('Revise: '+er.slice(0,6).join(' · ')+(er.length>6?' …':''),6000);return !er.length}

/* ================= MOTOR DE DISEÑO (mm, A4 horizontal) =================
   Genera páginas de primitivas (línea / texto / imagen). Las mismas dibujan la vista previa y el PDF. */
const PW=297,PH=210,X0=8,TW=281,RH=7,HH=10,YMAX=204;
const COLS=[{k:'n',w:6,h:['N.º']},{k:'fecha',w:14,h:['FECHA']},{k:'hora',w:10,h:['HORA']},{k:'cm',w:9,g:'VARILLAJE (A)',h:['cm']},{k:'galA',w:11,g:'VARILLAJE (A)',h:['gal']},
 {k:'agua',w:10,h:['AGUA (B)','gal']},{k:'diesel',w:12,h:['DIESEL','(A-B) gal']},{k:'cant',w:14,h:['CANTIDAD','DESPACHADA','gal']},{k:'sello',w:14,h:['SELLO','SEGURIDAD']},
 {k:'loc',w:18,h:['LOCAL / POZO']},{k:'guia',w:14,h:['GUÍA','SHAYA']},{k:'perm',w:15,h:['PERMISO','TRABAJO']},{k:'rp',w:24,h:['REALIZADO POR']},{k:'rci',w:17,h:['CI']},
 {k:'rf',w:18,h:['FIRMA'],sig:1},{k:'mh',w:10,h:['N.º','MANHOLE']},{k:'cp',w:24,h:['RECIBIDO POR']},{k:'cci',w:17,h:['CI']},{k:'cf',w:18,h:['FIRMA'],sig:1}];
const CW=(()=>{const s=COLS.reduce((a,c)=>a+c.w,0);let x=X0;return COLS.map(c=>{const w=c.w*TW/s,o={...c,x,w};x+=w;return o})})();
const segs=(t,m)=>t.split(/(\{[A-Z]+\})/).map(s=>/^\{[A-Z]+\}$/.test(s)?{t:'val',s:m[s.slice(1,-1)]||''}:{t:'txt',s}).filter(g=>g.t=='val'||g.s.trim());

function build(doc,nro){
 const E=eff(doc),H=doc.h,pages=[];let P;
 const L=(a,b,c,e,w=.2)=>P.push({k:'l',a,b,c,e,w}),
 T=(s,x,y,o={})=>{if(s===''||s==null)return;let z=o.z||7;if(o.mw)while(z>(o.mz||5)&&W(s,z,o.b,o.i)>o.mw)z-=.25;P.push({k:'t',s:String(s),x,y,z,b:o.b,i:o.i,a:o.a||'l'})},
 I=(src,x,y,w,h)=>src&&P.push({k:'i',src,x,y,w,h,fit:1});
 const cb=(x,y,on)=>{L(x,y-2.6,x+2.8,y-2.6);L(x,y+.2,x+2.8,y+.2);L(x,y-2.6,x,y+.2);L(x+2.8,y-2.6,x+2.8,y+.2);if(on){L(x+.4,y-2.2,x+2.4,y-.2,.35);L(x+2.4,y-2.2,x+.4,y-.2,.35)}};
 /* texto corrido con campos subrayados y casillas; devuelve la siguiente y */
 const flow=(sg,x,y,w,z,lh)=>{let cx=x;const sp=W(' ',z),nl=()=>{cx=x;y+=lh};
  for(const g of sg){
   if(g.t=='txt')for(const wd of g.s.split(/\s+/).filter(Boolean)){if(/^[,.;:]/.test(wd))cx=Math.max(x,cx-sp);const ww=W(wd,z,g.b);if(cx+ww>x+w+.1&&cx>x)nl();T(wd,cx,y,{z,b:g.b});cx+=ww+sp}
   else if(g.t=='val'){const s=g.s||'',ww=Math.min(w,Math.max(W(s,z,1)+2,s?8:22));if(cx+ww>x+w&&cx>x)nl();T(s,cx+ww/2,y,{z,b:1,a:'c',mw:ww-1});L(cx,y+.8,cx+ww,y+.8);cx+=ww+sp}
   else{if(cx+4>x+w&&cx>x)nl();cb(cx,y,g.on);cx+=3.4+sp}}
  return y+lh};
 const sign=(img,cx,yl,w,ls)=>{I(img,cx-22,yl-12.5,44,12);L(cx-w/2,yl,cx+w/2,yl,.3);ls.forEach(([s,b],j)=>T(s,cx,yl+3.3+j*3,{z:6.8,b,a:'c',mw:w}))};
